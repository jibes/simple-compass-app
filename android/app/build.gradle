plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Release signing: CI secrets override the in-repo key (see README → Signing).
def keystoreFile = System.getenv("COMPASS_KEYSTORE") ?: "${rootDir}/signing/compass.jks"
def keystorePassword = System.getenv("COMPASS_KEYSTORE_PASSWORD") ?: "compass"
def keyAliasName = System.getenv("COMPASS_KEY_ALIAS") ?: "compass"
def keyPasswordValue = System.getenv("COMPASS_KEY_PASSWORD") ?: keystorePassword

android {
    namespace "io.github.jibes.compass"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.jibes.compass"
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName project.findProperty("versionName") ?: "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(keystoreFile)
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keyPasswordValue
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    // The web app is the UI; ship it verbatim as assets.
    sourceSets {
        main.assets.srcDirs = ["${rootDir}/../web"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    dependenciesInfo {
        // Opaque Google-signed blob; omit so F-Droid/Obtainium users can verify builds.
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.webkit:webkit:1.12.1"
}
